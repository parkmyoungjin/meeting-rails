services:
  - type: web
    name: meeting-rails
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: FORCE_SSL
        value: "true"
      - key: APP_DOMAIN
        sync: false
      - key: CORS_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CACHE_DATABASE_URL
        sync: false
      - key: QUEUE_DATABASE_URL
        sync: false
      - key: CABLE_DATABASE_URL
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_BASIC
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: SUPER_ADMIN_USERNAME
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
